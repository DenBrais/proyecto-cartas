<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/style.css" />
    <title>Cartas Paises</title>
  </head>
  <body>
    <div class="welcome-container">
      <h1>Bienvenido al juego cartas de Países</h1>
      <p>
        Explora información sobre diferentes países haciendo click en las
        cartas.
      </p>
      <p>¡Si haces match con las cartas ganas el juego!</p>
      <h2>Elige un nivel</h2>
      <div class="level-selector" id="level-selector">
        <label>
          <input type="radio" name="level" value="2" checked />
          Nivel1 (2x2)
        </label>
        <label>
          <input type="radio" name="level" value="4" />
          Nivel2 (4x4)
        </label>
        <label>
          <input type="radio" name="level" value="6" />
          Nivel3 (6x6)
        </label>
        <label>
          <input type="radio" name="level" value="8" />
          Nivel4 (8x8)
        </label>
        <label>
          <input type="radio" name="level" value="10" />
          Nivel 5 (10x10)
        </label>
      </div>
    </div>
    <div class="info" id="info">
      <!-- <h2 id="timer">Tiempo: 0s</h2>
      <h2 id="moves">Movimientos: 0</h2>
      <h2 id="matches">Aciertos: 0</h2>
      <h2 id="best-time">Mejor Tiempo: 0s</h2> -->
    </div>
    <div class="card-container" id="card-container">
      <!-- <div class="card" id="card">
        <div class="card-front">
          <h2>País Desconocido</h2>
          <img src="images/placeholder.png" alt="Imagen del país" />
        </div>
        <div class="card-back">
          <h2>Información del País</h2>
        </div> -->
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
